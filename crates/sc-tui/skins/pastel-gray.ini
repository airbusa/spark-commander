# Pastel Gray: calm pastel accents on neutral gray. A Midnight Commander skin,
# built into Spark Commander's scmd (scmd -S pastel-gray).
#
# For mc itself (4.8.19 or newer, built with S-Lang, in a true-colour terminal:
# COLORTERM=truecolor), copy it to ~/.local/share/mc/skins/ and choose it in
# Options > Appearance, or run mc -S pastel-gray.

[skin]
    description = Pastel Gray
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    Background = #2b2f36
    Panel = #353a41
    Border = #4a515a
    Bar = #c2c8cf
    Selected = #a6c7c9
    SelectedInactive = #4a5962
    Directory = #8fb8d8
    File = #d7dde3
    Executable = #a9d3a7
    Archive = #e6c08f
    Media = #c7a5d8
    Link = #90c8c1
    Emphasis = #ededed
    Dim = #9da3aa
    Marked = #f0d58c
    # Hot keys on the bars, errors, a marked file under the cursor, dimmed text on light fills.
    Hot = #314b60
    Error = #e0a3a3
    ErrorHot = #6f2626
    MarkSelected = #4a3209
    DimOnLight = #434950

[core]
    _default_ = File;Panel
    selected = Background;Selected
    marked = Marked;;bold
    markselect = MarkSelected;Selected;bold
    gauge = Background;Selected
    input = Background;Selected
    inputunchanged = DimOnLight;Selected
    inputmark = Background;Bar
    disabled = DimOnLight;Bar
    reverse = File;SelectedInactive
    commandlinemark = Background;Selected
    header = Emphasis;;bold
    inputhistory = Background;Bar
    commandhistory = Background;Bar
    shadow = Border;Background

[dialog]
    _default_ = Background;Bar
    dfocus = Background;Selected
    dhotnormal = Hot;Bar
    dhotfocus = Hot;Selected
    dtitle = Background;Bar;bold

[error]
    _default_ = Background;Error
    errdfocus = Background;Bar
    errdhotnormal = ErrorHot;Error
    errdhotfocus = ErrorHot;Bar
    errdtitle = Background;Error;bold

[filehighlight]
    directory = Directory;
    executable = Executable;
    symlink = Link;
    hardlink = File;
    stalelink = Error;
    device = Emphasis;
    special = Dim;
    core = Error;
    temp = Dim;
    archive = Archive;
    doc = File;
    source = File;
    media = Media;
    graph = File;
    database = File;

[menu]
    _default_ = Background;Bar
    menusel = Background;Selected
    menuhot = Hot;Bar
    menuhotsel = Hot;Selected
    menuinactive = DimOnLight;Bar

[popupmenu]
    _default_ = File;Panel
    menusel = Background;Selected
    menutitle = Emphasis;Panel;bold

[buttonbar]
    hotkey = Bar;Background;bold
    button = Background;Bar

[statusbar]
    _default_ = Background;Bar

[help]
    _default_ = Background;Bar
    helpitalic = Hot;Bar;italic
    helpbold = Background;Bar;bold
    helplink = Background;Selected
    helpslink = File;SelectedInactive
    helptitle = Background;Bar;bold

[editor]
    _default_ = File;Background
    editbold = Emphasis;;bold
    editmarked = Background;Selected
    editwhitespace = Border;Background
    editnonprintable = Dim;Background
    editlinestate = Dim;Panel
    bookmark = Background;Archive
    bookmarkfound = Background;Executable
    editrightmargin = Border;Background
    editframe = Border;
    editframeactive = Bar;
    editframedrag = Selected;

[viewer]
    _default_ = File;Panel
    viewbold = Emphasis;;bold
    viewunderline = Link;;underline
    viewselected = Background;Selected

[diffviewer]
    added = Background;Executable
    changedline = File;SelectedInactive
    changednew = Background;Archive
    changed = Background;Bar
    removed = Background;Error
    error = Background;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
